<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="2.5" />
  
  <!-- Checklist background paper hint -->
  <rect x="14" y="12" width="36" height="40" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />

  <!-- Item 1: Checked -->
  <circle cx="21" cy="21" r="4" fill="url(#checkGrad)" filter="url(#glow)" />
  <path d="M19.2 21L20.4 22.2L22.8 19.8" stroke="#042f2e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="28" y="19" width="16" height="3.5" rx="1.75" fill="#e2e8f0" />

  <!-- Item 2: Checked -->
  <circle cx="21" cy="31" r="4" fill="url(#checkGrad)" filter="url(#glow)" />
  <path d="M19.2 31L20.4 32.2L22.8 29.8" stroke="#042f2e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="28" y="29" width="13" height="3.5" rx="1.75" fill="#94a3b8" />

  <!-- Item 3: Progress spark / summary spark -->
  <circle cx="21" cy="41" r="4" stroke="#38bdf8" stroke-width="1.8" fill="none" />
  <circle cx="21" cy="41" r="1.5" fill="#38bdf8" />
  <rect x="28" y="39" width="18" height="3.5" rx="1.75" fill="#64748b" />

  <!-- Summary spark badge in bottom corner -->
  <path d="M48 42L49.5 45.5L53 47L49.5 48.5L48 52L46.5 48.5L43 47L46.5 45.5L48 42Z" fill="#38bdf8" filter="url(#glow)" />
</svg>
